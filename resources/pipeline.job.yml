# =============================================================================
# resources/pipeline.job.yml
# Job rotaperfume_pipeline.
#
#   DESENHO ATUAL (17 tasks):
#   raw_conferencia
#     └── bronze_ingestao
#           ├── silver_clientes         (paralelo)
#           ├── silver_pedidos          (paralelo)
#           ├── silver_itens_produtos   (paralelo)
#           └── silver_crm_financeiro   (paralelo)
#                  └── gold_dimensoes
#                        └── gold_fato_vendas
#                              └── gold_marts
#                                    ├── metricas_de_negocio
#                                    │     └── auditoria_de_metadado
#                                    │           └── testes
#                                    │                 └── dashboard_refresh
#                                    ├── gold_retorno_ligacao
#                                    └── ml_features
#                                          └── ml_modelo
#                                                └── ml_fila
# =============================================================================

resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      description: "Pipeline completo do catálogo rotaperfume — 17 tasks (raw → bronze → silver → gold + ML + fila)."

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: PAUSED

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: raw_conferencia
          description: "Conferência de chegada — valida que os 10 CSVs estão no Volume."
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_ingestao
          description: "Ingestão bronze — lê 10 CSVs como string, grava 10 tabelas Delta."
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_clientes
          description: "Silver.clientes — CNPJ normalizado a 14 dígitos, dedup, contrato."
          depends_on:
            - task_key: bronze_ingestao
          notebook_task:
            notebook_path: ../src/silver/01-clientes.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_pedidos
          description: "Silver.pedidos — datas tipadas, valor_total DECIMAL, cancelado boolean, valor_liquido."
          depends_on:
            - task_key: bronze_ingestao
          notebook_task:
            notebook_path: ../src/silver/02-pedidos.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_itens_produtos
          description: "Silver.itens_pedido + produtos — devolução marcada, sku_descontinuado."
          depends_on:
            - task_key: bronze_ingestao
          notebook_task:
            notebook_path: ../src/silver/03-itens-e-produtos.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_crm_financeiro
          description: "Silver vendedores, carteira, oportunidades, visitas, pagamentos, estoque."
          depends_on:
            - task_key: bronze_ingestao
          notebook_task:
            notebook_path: ../src/silver/04-crm-e-financeiro.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_dimensoes
          description: "Gold — 4 dimensoes conformadas: dim_cliente, dim_produto, dim_vendedor, dim_calendario."
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_produtos
            - task_key: silver_crm_financeiro
          notebook_task:
            notebook_path: ../src/gold/05-dimensoes.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_fato_vendas
          description: "Gold — fato_vendas: item de pedido, cancelados fora, devolucao com valor negativo."
          depends_on:
            - task_key: gold_dimensoes
          notebook_task:
            notebook_path: ../src/gold/06-fato-vendas.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_marts
          description: "Gold — 3 marts: vendedor, produto, financeiro. Todos sobre o mesmo fato."
          depends_on:
            - task_key: gold_fato_vendas
          notebook_task:
            notebook_path: ../src/gold/07-marts.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_retorno_ligacao
          description: "Gold — Tabela retorno_ligacao (cria se nao existir). Dado vem do time, nao do pipeline."
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/11-retorno-ligacao.sql

        - task_key: metricas_de_negocio
          description: "Gold — 6 views de negocio: receita_mensal, ranking_marcas, margem_por_categoria, clientes_em_risco, efeito_lancamento, ruptura_por_marca."
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/09-metricas-negocio.sql

        - task_key: auditoria_de_metadado
          description: "Gold — Verifica COMMENT em todas as tabelas/colunas da gold. Quebra o job se faltar."
          depends_on:
            - task_key: metricas_de_negocio
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/10-auditoria-metadado.sql

        - task_key: testes
          description: "Gold — 9 testes de qualidade com raise_error(). Se algum falhar, o job para."
          depends_on:
            - task_key: auditoria_de_metadado
          notebook_task:
            notebook_path: ../src/gold/08-testes.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: ml_features
          description: "ML — Feature engineering: 20 features por cliente, 4 grupos (RFM, Ritmo, CRM, Mix)."
          depends_on:
            - task_key: testes
          notebook_task:
            notebook_path: ../src/ml/11-features.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: ml_modelo
          description: "ML — Treino HistGradientBoosting, MLflow, score_propensao, metricas."
          depends_on:
            - task_key: ml_features
          notebook_task:
            notebook_path: ../src/ml/12-modelo.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: ml_fila
          description: "ML — Fila semanal 200 contatos, 4 funcoes SQL, 3 testes."
          depends_on:
            - task_key: ml_modelo
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ml/13-fila.sql

        - task_key: dashboard_refresh
          description: "Dashboard comercial AI/BI — verifica que tabelas existem antes de exibir."
          depends_on:
            - task_key: testes
            - task_key: ml_fila
            - task_key: gold_retorno_ligacao
          notebook_task:
            notebook_path: ../src/gold/12-dashboard-refresh.py
            base_parameters:
              catalog: ${var.catalog}

      tags:
        projeto: rotaperfume
        aula: "engenharia-de-dados"
